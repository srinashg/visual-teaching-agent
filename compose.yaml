services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: teaching_agent
      POSTGRES_USER: teaching_app
      POSTGRES_PASSWORD: teaching_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teaching_app -d teaching_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
